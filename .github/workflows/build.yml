name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact: Lootbag-macos.zip
          - os: windows-latest
            bundle: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches local development; tests run .ts via type stripping
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm -s typecheck
      - run: pnpm -s test

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Unsigned bundle; signing and notarization are not configured here.
      - run: pnpm tauri build --bundles ${{ matrix.bundle }}

      # A zipped .app keeps its executable bits, which a plain directory upload drops.
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Lootbag.app Lootbag-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lootbag-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
