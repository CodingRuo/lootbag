[package]
name = "lootbag"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "lootbag"

[[bin]]
name = "lootbag"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2.7.1", optional = true, features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "id3v2"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri = { version = "2.12.1", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
