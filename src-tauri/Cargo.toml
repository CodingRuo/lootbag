[package]
name = "lootbag"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "lootbag"

[[bin]]
name = "lootbag"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:drag", "dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2.7.1", optional = true, features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
sha2 = "0.10"
crc32fast = "1.5"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "id3v2"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
tauri = { version = "2.12.1", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

# macOS drags natively from the real mouse events (src/drag_mac.rs); the crate serves the rest.
[target.'cfg(not(target_os = "macos"))'.dependencies]
drag = { version = "2.1.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
